<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logging Out - SCMM</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d2c54; display: flex; justify-content: center; align-items: center; min-height: 100vh; color: #ffffff; text-align: center; }
        .logout-card { background-color: #13315c; padding: 40px; border-radius: 12px; border: 2px solid #e2b13c; width: 360px; box-shadow: 0 8px 30px rgba(0,0,0,0.5); }
        h2 { color: #e2b13c; margin-bottom: 10px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 14px; color: #8da9c4; margin-bottom: 20px; }
        a { display: inline-block; background: linear-gradient(180deg, #e2b13c 0%, #c49429 100%); color: #111; padding: 10px 20px; border-radius: 6px; font-weight: bold; font-size: 13px; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body>

    <div class="logout-card">
        <h2>Logged Out Successfully</h2>
        <p>Your admin session has been securely terminated.</p>
        <a href="login.html">Log In Again</a>
    </div>

    <script>
        sessionStorage.removeItem('scmm_admin_logged');
    </script>
</body>
</html>
