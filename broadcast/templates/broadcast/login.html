<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMM Admin Login</title>
    <style>
        :root {
            --bg-dark-blue: #0b2545;
            --panel-blue: #13315c;
            --accent-gold: #e2b13c;
            --text-light: #ffffff;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0d2c54; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .login-box {
            background-color: var(--panel-blue);
            padding: 40px;
            border-radius: 12px;
            border: 2px solid var(--accent-gold);
            width: 360px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .login-box h2 { color: var(--accent-gold); margin-bottom: 20px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; color: white; font-size: 14px; outline: none; text-align: center;
        }
        .login-box button {
            width: 100%; background: linear-gradient(180deg, var(--accent-gold) 0%, #c49429 100%);
            color: #111; padding: 12px; border: none; border-radius: 6px;
            font-weight: bold; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .login-box button:disabled { background: #666; cursor: not-allowed; }
        .login-error { color: #ff6b6b; font-size: 12px; margin-top: 10px; display: none; }
        .back-link { display: block; margin-top: 15px; color: var(--text-light); font-size: 12px; text-decoration: none; opacity: 0.8; }
        .back-link:hover { opacity: 1; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Admin Authentication</h2>
        <form onsubmit="handleLogin(event)" autocomplete="off">
            <input type="text" id="admin-user" placeholder="Username" required autocomplete="off">
            <input type="password" id="admin-pass" placeholder="Password" required autocomplete="new-password">
            <button type="submit" id="loginBtn">Log In</button>
            <div id="login-error" class="login-error">Incorrect username or password.</div>
        </form>
        <a href="viewer.html" class="back-link">← Return to Public Viewer Screen</a>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('admin-user').value.trim();
            const passInput = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Checking...";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userInput, password: passInput })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('scmm_admin_logged', 'true');
                    window.location.href = 'index.html';
                } else {
                    errorDiv.style.display = 'block';
                    document.getElementById('admin-pass').value = '';
                }
            } catch (e) {
                errorDiv.innerText = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        }

        window.onload = function() {
            if (sessionStorage.getItem('scmm_admin_logged') === 'true') {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
