<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a4d3c">
    <title>SCMM Admin Login</title>
    <style>
        :root {
            --green: #0b5d4b;
            --accent-gold: #d9a21f;
            --cream: #fffbf2;
            --line: #eadfc6;
            --ink: #1d2f2a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(180deg, #0e6b52 0%, #0a4a3b 55%, #07352b 100%); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-box {
            background-color: var(--cream);
            padding: 40px 36px;
            border-radius: 14px;
            border: 1px solid var(--line);
            border-top: 5px solid var(--accent-gold);
            width: 380px;
            max-width: 100%;
            text-align: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
        }
        .login-logo { width: 64px; height: auto; margin-bottom: 10px; }
        .login-org { color: #5f7a70; font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px; }
        .login-box h2 { color: var(--green); margin-bottom: 22px; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        .login-box input {
            width: 100%; padding: 12px; margin-bottom: 15px;
            background: #fff8ea; border: 1px solid var(--line);
            border-radius: 8px; color: var(--ink); font-size: 14px; outline: none; text-align: center;
        }
        .login-box input::placeholder { color: #a08b5c; }
        .login-box input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(11,93,75,0.15); }
        .login-box button {
            width: 100%; background: linear-gradient(180deg, #12875c 0%, #0a5c3f 100%);
            color: #fff; padding: 12px; border: none; border-radius: 8px;
            font-weight: bold; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
        }
        .login-box button:hover { background: linear-gradient(180deg, #159a69 0%, #0c6c49 100%); }
        .login-box button:disabled { background: #9aa8a2; cursor: not-allowed; }
        .login-error { color: #b42b2b; font-size: 12px; margin-top: 10px; display: none; }
        .back-link { display: block; margin-top: 18px; color: var(--green); font-size: 12px; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="login-box">
        <img src="/sda-logo.png" alt="Seventh-day Adventist Church Symbol" class="login-logo" onerror="this.style.display='none'">
        <div class="login-org">South Central Mindanao Mission</div>
        <h2>Admin Authentication</h2>
        <form onsubmit="handleLogin(event)" autocomplete="off">
            <input type="text" id="admin-user" placeholder="Username" required autocomplete="off">
            <input type="password" id="admin-pass" placeholder="Password" required autocomplete="new-password">
            <button type="submit" id="loginBtn">Log In</button>
            <div id="login-error" class="login-error">Incorrect username or password.</div>
        </form>
        <a href="viewer.html" class="back-link">← Return to Public Viewer Screen</a>
    </div>

    <script>
        async function handleLogin(event) {
            event.preventDefault();
            const userInput = document.getElementById('admin-user').value.trim();
            const passInput = document.getElementById('admin-pass').value;
            const errorDiv = document.getElementById('login-error');
            const btn = document.getElementById('loginBtn');

            errorDiv.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Checking...";

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: userInput, password: passInput })
                });
                const data = await res.json();

                if (data.success) {
                    sessionStorage.setItem('scmm_admin_logged', 'true');
                    sessionStorage.setItem('scmm_admin_username', userInput);
                    window.location.href = 'index.html';
                } else {
                    errorDiv.style.display = 'block';
                    document.getElementById('admin-pass').value = '';
                }
            } catch (e) {
                errorDiv.innerText = 'Connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = "Log In";
            }
        }

        window.onload = function() {
            if (sessionStorage.getItem('scmm_admin_logged') === 'true') {
                window.location.href = 'index.html';
            }
        };
    </script>
</body>
</html>
