<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMM Media Center Broadcast Dashboard</title>
    <style>
        :root { --bg-dark-blue: #0b2545; --panel-blue: #13315c; --accent-gold: #e2b13c; --accent-gold-hover: #f3c653; --text-light: #ffffff; --text-muted: #8da9c4; --danger-red: #8b2635; --danger-red-hover: #a32c3f; --success-green: #00b4d8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: #f0f4f8; color: #333; display: flex; min-height: 100vh; }
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--bg-dark-blue) 0%, var(--panel-blue) 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; transition: opacity 0.3s ease; }
        .login-box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 12px; width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .login-logo { width: 70px; margin-bottom: 15px; }
        .login-box h2 { color: var(--text-light); font-size: 20px; margin-bottom: 5px; font-weight: 600; }
        .login-box p { color: var(--accent-gold); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 12px 16px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; color: white; }
        .login-box button { width: 100%; padding: 12px; background: linear-gradient(180deg, var(--accent-gold) 0%, #c49429 100%); border: none; border-radius: 6px; color: #222; font-weight: bold; cursor: pointer; }
        #dashboard { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        .sidebar-brand { width: 140px; background-color: var(--bg-dark-blue); display: flex; flex-direction: column; align-items: center; padding-top: 30px; border-right: 1px solid rgba(255,255,255,0.05); }
        .brand-logo { width: 70px; height: auto; margin-bottom: 10px; }
        .brand-text { color: var(--text-light); font-weight: bold; font-size: 18px; letter-spacing: 1px; }
        .main-workspace { flex: 1; display: flex; flex-direction: column; background-color: #0d2c54; overflow-y: auto; }
        header { background-color: var(--bg-dark-blue); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.05); }
        .header-title-set { display: flex; align-items: center; gap: 15px; }
        .header-titles h1 { color: var(--text-light); font-size: 20px; font-weight: 600; }
        .dashboard-grid { padding: 20px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; flex: 1; }
        .left-column-group { display: flex; flex-direction: column; gap: 20px; }
        .broadcast-console-module { background-color: var(--panel-blue); border-radius: 12px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .module-header-label { color: var(--text-light); font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 600; margin-bottom: 15px; }
        .btn-actuate { padding: 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
        .system-status-sidebar { background-color: var(--panel-blue); border-left: 1px solid rgba(255,255,255,0.05); padding: 25px 20px; }
    </style>
</head>
<body>
    <div id="auth-screen">
        <div class="login-box">
            <h2>SCMM Media Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="evaluateAccessAuthentication()">Sign In</button>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <aside class="sidebar-brand"><div class="brand-text">SCMM</div></aside>
        <div class="main-workspace">
            <header>
                <h1>BROADCAST DASHBOARD</h1>
                <button onclick="location.reload()">Logout</button>
            </header>

            <div class="dashboard-grid">
                <div class="left-column-group">
                    
                    <div class="broadcast-console-module">
                        <div class="module-header-label">Post Announcement</div>
                        <form method="POST" action="{% url 'add_post' %}">
                            {% csrf_token %}
                            <textarea name="content" style="width:100%; padding:10px; background:rgba(0,0,0,0.2); color:white; border:1px solid #444;" placeholder="Announcement..." required></textarea>
                            <button type="submit" style="width:100%; padding:10px; margin-top:5px; background:var(--accent-gold); border:none; cursor:pointer;">POST</button>
                        </form>
                    </div>

                    <div class="broadcast-console-module">
                        <div class="module-header-label">Live Streaming Control Panel</div>
                        <button class="btn-actuate" onclick="fetch('/start-stream/')">Start Stream</button>
                        <button class="btn-actuate" onclick="fetch('/stop-stream/')">Stop Stream</button>
                    </div>
                </div>
                <aside class="system-status-sidebar">System Status</aside>
            </div>
        </div>
    </div>
    <script>
        function evaluateAccessAuthentication() {
            if (document.getElementById('username').value === "SCMM" && document.getElementById('password').value === "admin123") {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
            } else { alert("Invalid Credentials"); }
        }
    </script>
</body>
</html>
