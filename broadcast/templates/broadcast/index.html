<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMM Media Center Broadcast Dashboard</title>
    <style>
        :root {
            --bg-dark-blue: #0b2545;
            --panel-blue: #13315c;
            --accent-gold: #e2b13c;
            --text-light: #ffffff;
            --text-muted: #8da9c4;
            --danger-red: #8b2635;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #f0f4f8; display: flex; min-height: 100vh; }
        #auth-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, var(--bg-dark-blue) 0%, var(--panel-blue) 100%); display: flex; justify-content: center; align-items: center; z-index: 9999; }
        .login-box { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(10px); padding: 40px; border-radius: 12px; width: 360px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; color: white; }
        .login-box button { width: 100%; padding: 12px; background: var(--accent-gold); border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        #dashboard { display: flex; width: 100%; height: 100vh; overflow: hidden; }
        .sidebar-brand { width: 140px; background-color: var(--bg-dark-blue); display: flex; flex-direction: column; align-items: center; padding-top: 30px; }
        .main-workspace { flex: 1; display: flex; flex-direction: column; background-color: #0d2c54; overflow-y: auto; }
        header { background-color: var(--bg-dark-blue); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        .dashboard-grid { padding: 20px; display: grid; grid-template-columns: 1fr 340px; gap: 20px; }
        .broadcast-console-module { background-color: var(--panel-blue); border-radius: 12px; padding: 25px; margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.05); }
        .module-header-label { color: var(--text-light); font-size: 13px; text-transform: uppercase; margin-bottom: 15px; font-weight: 600; }
        .btn-actuate { padding: 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 48%; }
    </style>
</head>
<body>

    <div id="auth-screen">
        <div class="login-box">
            <h2>SCMM Media Login</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button onclick="evaluateAccessAuthentication()">Sign In</button>
        </div>
    </div>

    <div id="dashboard" style="display:none;">
        <aside class="sidebar-brand"><div class="brand-text">SCMM</div></aside>
        <div class="main-workspace">
            <header>
                <h1>BROADCAST DASHBOARD</h1>
                <button class="logout-action-btn" onclick="location.reload()">Logout</button>
            </header>

            <div class="dashboard-grid">
                <div class="left-column-group">
                    
                    <div class="broadcast-console-module">
                        <div class="module-header-label">Create Announcement</div>
                        <form method="POST" action="{% url 'add_post' %}">
                            {% csrf_token %}
                            <textarea name="content" style="width:100%; background:rgba(0,0,0,0.2); color:white; padding:10px; border-radius:6px;" placeholder="Write to viewers..." required></textarea>
                            <button type="submit" style="margin-top:10px; width:100%; padding:10px; background:var(--accent-gold); border:none; border-radius:6px; cursor:pointer;">Post Announcement</button>
                        </form>
                        <div style="margin-top:15px; color:var(--text-muted); font-size:12px;">
                            {% for post in posts %}
                                <p>• {{ post.content }} <small>({{ post.created_at|date:"H:i" }})</small></p>
                            {% endfor %}
                        </div>
                    </div>

                    <div class="broadcast-console-module">
                        <div class="module-header-label">Live Streaming Controls</div>
                        <button id="startBtn" class="btn-actuate" style="background:var(--accent-gold)" onclick="fetch('/start-stream/')">Start Stream</button>
                        <button id="stopBtn" class="btn-actuate" style="background:var(--danger-red); color:white" onclick="fetch('/stop-stream/')">Stop Stream</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function evaluateAccessAuthentication() {
            if (document.getElementById('username').value === "SCMM" && document.getElementById('password').value === "admin123") {
                document.getElementById('auth-screen').style.display = 'none';
                document.getElementById('dashboard').style.display = 'flex';
            } else { alert("Invalid Credentials"); }
        }
    </script>
</body>
</html>
