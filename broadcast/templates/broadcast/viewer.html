<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCMM Live Media Center</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root { --bg-dark-blue: #0b2545; --accent-gold: #e2b13c; --text-light: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark-blue); color: var(--text-light); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        .page-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .stream-box { background: #000; border-radius: 8px; overflow: hidden; height: 300px; width: 100%; border: 2px solid var(--accent-gold); margin-bottom: 20px; }
        iframe { width: 100%; height: 100%; border: none; }
        .social-links { margin-bottom: 20px; }
        .social-links a { display: block; color: var(--accent-gold); text-decoration: none; margin-bottom: 10px; font-weight: bold; }
        .post-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent-gold); }
        .post-image { width: 100%; max-height: 300px; object-fit: cover; border-radius: 6px; margin-bottom: 15px; display: block; }
        .comment-section { margin-top: 30px; background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; }
        .comment { border-bottom: 1px solid #444; padding: 10px 0; }
        @media (max-width: 900px) { .page-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: var(--accent-gold);">SCMM Live Broadcast</h1>
        <div class="page-wrapper">
            <main>
                <div class="stream-box">
                    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" allowfullscreen></iframe>
                </div>
            </main>
            
            <aside id="update-container">
                <div id="announcement-content" 
                     hx-get="{% url 'live_viewer' %}" 
                     hx-trigger="every 5s" 
                     hx-swap="innerHTML">
                     {% include 'broadcast/partials/post_update.html' %}
                </div>

                <div id="comment-box">
                     {% include 'broadcast/partials/comment_section.html' %}
                </div>
            </aside>
        </div>
    </div>
</body>
</html>
