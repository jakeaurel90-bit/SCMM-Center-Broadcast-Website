<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCMM Live Broadcast</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <!-- Firebase SDKs for permanent online cloud database synchronization -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        :root { --bg-dark-blue: #0b2545; --accent-gold: #e2b13c; --text-light: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark-blue); color: var(--text-light); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }

        .verse-container {
            margin: 20px auto;
            padding: 40px;
            border-radius: 8px;
            background-image: url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=1000');
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            max-width: 800px;
            position: relative;
            border: 2px solid var(--accent-gold);
        }
        .verse-overlay {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 8px;
        }

        .page-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .stream-box { background: #000; border-radius: 8px; overflow: hidden; min-height: 450px; width: 100%; border: 2px solid var(--accent-gold); margin-bottom: 20px; display: flex; flex-direction: column; }

        iframe { width: 100%; height: 100%; border: none; flex: 1; }
        #update-container { display: flex; flex-direction: column; gap: 20px; }

        .social-links { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .social-btn { color: var(--accent-gold); font-weight: bold; text-decoration: none; padding: 8px 16px; border: 1px solid var(--accent-gold); border-radius: 4px; transition: 0.3s; cursor: pointer; background: none; font-size: 14px; font-family: inherit; display: inline-flex; align-items: center; justify-content: center; }
        .social-btn:hover { background: var(--accent-gold); color: var(--bg-dark-blue); }

        .post-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent-gold); margin-bottom: 15px; }
        .post-card h4 { color: var(--accent-gold); margin-top: 0; margin-bottom: 8px; font-size: 16px; }
        .post-card p { color: #f0f0f0; font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
        .post-media-container { margin-top: 10px; border-radius: 6px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        .post-media-container img, .post-media-container video { width: 100%; max-height: 300px; object-fit: contain; }
        .post-date { font-size: 10px; color: #8da9c4; text-transform: uppercase; margin-top: 8px; }

        @media (max-width: 900px) { .page-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: var(--accent-gold);">SCMM Live Broadcast</h1>

        <div class="verse-container">
            <div class="verse-overlay">
                <h3 style="margin-top:0;">Daily Inspiration</h3>
                <p id="bible-verse">Loading verse...</p>
            </div>
        </div>

        <script>
            fetch('https://bible-api.com/?random=verse')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('bible-verse').innerText = '"' + data.text.trim() + '" — ' + data.reference;
                })
                .catch(() => {
                    document.getElementById('bible-verse').innerText = '"Trust in the Lord with all your heart." — Proverbs 3:5';
                });
        </script>

        <div class="social-links">
            <a href="https://www.facebook.com/scmm.head.quarters" target="_blank" class="social-btn">Facebook</a>
            <a href="https://www.youtube.com/@scmm" target="_blank" rel="noopener noreferrer" class="social-btn">YouTube Channel Hub (@scmm)</a>
        </div>

        <div class="page-wrapper" style="margin-top: 20px;">
            <main>
                <!-- referrerpolicy fixes YouTube's "Error 153: Video player configuration error",
                     which happens when the browser doesn't send YouTube a proper referrer header
                     (Django's SecurityMiddleware strips it by default). -->
                <div class="stream-box" id="main-live-player-container">
                    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
                </div>
            </main>

            <aside id="update-container">
                <div id="announcement-content">
                    <h3 style="color: var(--accent-gold); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">Recent Broadcast Posts</h3>
                    <div id="viewer-posts-feed">
                        <div class="post-card">
                            <p style="color: #8da9c4; margin: 0;">Connecting to cloud broadcast stream...</p>
                        </div>
                    </div>
                </div>

                <div id="comment-box">
                     {% include 'broadcast/partials/comment_section.html' %}
                </div>
            </aside>
        </div>
    </div>

    <script>
        // =====================================================================
        // FIREBASE CONFIG - must be the EXACT SAME values as in index.html,
        // pointing at the same Firebase project. A mismatch here is the most
        // common reason posts show in the admin dashboard but not here.
        // =====================================================================
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        function extractFacebookUrl(text) {
            if (!text) return null;
            const fbRegex = /(https?:\/\/(?:www\.)?(?:facebook\.com|fb\.watch|[\w.-]+\/videos\/|[\w.-]+\/live_videos\/)[^\s]+)/g;
            const fbMatch = text.match(fbRegex);
            if (fbMatch && fbMatch.length > 0) {
                const cleanUrl = fbMatch[0].replace(/[.,;!?)]$/, '');
                return `https://www.facebook.com/plugins/video.php?href=${encodeURIComponent(cleanUrl)}&show_text=false&width=560&autoplay=true`;
            }
            return null;
        }

        function listenToCloudPostsOnline() {
            db.collection("broadcast_posts").orderBy("createdAt", "desc")
              .onSnapshot((snapshot) => {
                  let posts = [];
                  snapshot.forEach((doc) => {
                      posts.push({ id: doc.id, ...doc.data() });
                  });
                  renderOnlineViewerPosts(posts);
              }, (error) => {
                  console.error("Cloud synchronization error:", error);
                  document.getElementById('viewer-posts-feed').innerHTML = `
                      <div class="post-card">
                          <p style="color: #ff6b81; margin: 0;">Cloud sync waiting for configuration.</p>
                      </div>
                  `;
              });
        }

        function renderOnlineViewerPosts(posts) {
            const feedContainer = document.getElementById('viewer-posts-feed');
            const mainPlayerContainer = document.getElementById('main-live-player-container');
            const defaultPlayerHtml = `<iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;

            let activeFacebookEmbedUrl = null;

            if (!posts || posts.length === 0) {
                feedContainer.innerHTML = `
                    <div class="post-card">
                        <p style="color: #8da9c4; margin: 0;">No active broadcast announcements at this time.</p>
                    </div>
                `;
                const currentIframe = mainPlayerContainer.querySelector('iframe');
                if (!currentIframe || !currentIframe.src.includes('live_stream')) {
                    mainPlayerContainer.innerHTML = defaultPlayerHtml;
                }
                return;
            }

            feedContainer.innerHTML = posts.map((post) => {
                let mediaHtml = '';
                if (post.mediaUrl) {
                    if (post.mediaType === 'video') {
                        mediaHtml = `<div class="post-media-container"><video controls src="${post.mediaUrl}"></video></div>`;
                    } else {
                        mediaHtml = `<div class="post-media-container"><img src="${post.mediaUrl}" alt="Post media"></div>`;
                    }
                }

                const fullText = (post.title || "") + " " + (post.content || "");
                const detectedFbUrl = extractFacebookUrl(fullText);

                if (detectedFbUrl && !activeFacebookEmbedUrl) {
                    activeFacebookEmbedUrl = detectedFbUrl;
                }

                let fbEmbedHtml = '';
                if (detectedFbUrl) {
                    fbEmbedHtml = `
                        <div class="post-media-container" style="height: 250px; margin-top: 10px;">
                            <iframe src="${detectedFbUrl}" width="100%" height="100%" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
                        </div>
                    `;
                }

                return `
                    <div class="post-card">
                        <h4>${escapeHtml(post.title)}</h4>
                        ${post.content ? `<p>${escapeHtml(post.content)}</p>` : ''}
                        ${mediaHtml}
                        ${fbEmbedHtml}
                        <div class="post-date">Published: ${post.date || 'Recent'}</div>
                    </div>
                `;
            }).join('');

            const currentIframe = mainPlayerContainer.querySelector('iframe');

            if (activeFacebookEmbedUrl) {
                const baseTargetUrl = activeFacebookEmbedUrl.split('?')[0];
                if (!currentIframe || !currentIframe.src.includes(baseTargetUrl)) {
                    mainPlayerContainer.innerHTML = `<iframe src="${activeFacebookEmbedUrl}" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
                }
            } else {
                if (!currentIframe || !currentIframe.src.includes('live_stream')) {
                    mainPlayerContainer.innerHTML = defaultPlayerHtml;
                }
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        listenToCloudPostsOnline();
    </script>
</body>
</html>
