<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SCMM Live Media Center</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        :root { --bg-dark-blue: #0b2545; --accent-gold: #e2b13c; --text-light: #ffffff; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-dark-blue); color: var(--text-light); margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* Daily Verse Styling */
        .verse-container {
            margin: 20px auto;
            padding: 40px;
            border-radius: 8px;
            background-image: url('https://images.unsplash.com/photo-1504052434569-70ad5836ab65?q=80&w=1000');
            background-size: cover;
            background-position: center;
            text-align: center;
            color: white;
            max-width: 800px;
            position: relative;
            border: 2px solid var(--accent-gold);
        }
        .verse-overlay {
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 8px;
        }

        .page-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        .stream-box { background: #000; border-radius: 8px; overflow: hidden; min-height: 400px; width: 100%; border: 2px solid var(--accent-gold); margin-bottom: 20px; display: flex; flex-direction: column; }
        
        iframe { width: 100%; height: 100%; border: none; flex: 1; }
        #update-container { display: flex; flex-direction: column; gap: 20px; }
        
        /* Social Media Button Styling */
        .social-links { display: flex; gap: 15px; justify-content: center; margin-top: 10px; }
        .social-btn { color: var(--accent-gold); font-weight: bold; text-decoration: none; padding: 8px 16px; border: 1px solid var(--accent-gold); border-radius: 4px; transition: 0.3s; }
        .social-btn:hover { background: var(--accent-gold); color: var(--bg-dark-blue); }

        .post-card { background: rgba(255,255,255,0.08); padding: 20px; border-radius: 8px; border-left: 4px solid var(--accent-gold); margin-bottom: 15px; }
        .post-card h4 { color: var(--accent-gold); margin-top: 0; margin-bottom: 8px; font-size: 16px; }
        .post-card p { color: #f0f0f0; font-size: 14px; line-height: 1.4; margin-bottom: 10px; }
        .post-media-container { margin-top: 10px; border-radius: 6px; overflow: hidden; background: #000; display: flex; justify-content: center; align-items: center; }
        .post-media-container img, .post-media-container video { width: 100%; max-height: 300px; object-fit: contain; }
        .post-date { font-size: 10px; color: #8da9c4; text-transform: uppercase; margin-top: 8px; }

        @media (max-width: 900px) { .page-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center; color: var(--accent-gold);">SCMM Live Broadcast</h1>
        
        <div class="verse-container">
            <div class="verse-overlay">
                <h3 style="margin-top:0;">Daily Inspiration</h3>
                <p id="bible-verse">Loading verse...</p>
            </div>
        </div>

        <script>
            fetch('https://bible-api.com/?random=verse')
                .then(response => response.json())
                .then(data => {
                    document.getElementById('bible-verse').innerText = '"' + data.text.trim() + '" — ' + data.reference;
                });
        </script>

        <div class="social-links">
            <a href="https://www.facebook.com/scmm.head.quarters" target="_blank" class="social-btn">Facebook</a>
            <a href="https://www.tiktok.com/@your-profile" target="_blank" class="social-btn">TikTok</a>
        </div>

        <div class="page-wrapper" style="margin-top: 20px;">
            <main>
                <!-- Dynamic Main Video Player (Prioritizes latest Facebook Live link posted, falls back to YouTube) -->
                <div class="stream-box" id="main-live-player-container">
                    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>
                </div>
            </main>
            
            <aside id="update-container">
                <div id="announcement-content">
                    <h3 style="color: var(--accent-gold); font-size: 14px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px;">Recent Broadcast Posts</h3>
                    <div id="viewer-posts-feed">
                        <!-- Posts dynamically injected here -->
                    </div>
                </div>

                <div id="comment-box">
                     {% include 'broadcast/partials/comment_section.html' %}
                </div>
            </aside>
        </div>
    </div>

    <script>
        // Robust parser to extract a clean Facebook URL from text inputs
        function extractFacebookUrl(text) {
            if (!text) return null;
            // Matches standard facebook video, watch, reel, live, or shared links
            const fbRegex = /(https?:\/\/(?:www\.)?(?:facebook\.com|fb\.watch)\/[^\s]+)/g;
            const matches = text.match(fbRegex);
            if (matches && matches.length > 0) {
                // Clean up trailing characters like punctuation marks if grabbed by mistake
                return matches[0].replace(/[.,;!?)]$/, '');
            }
            return null;
        }

        // Generates an unbugged, stable Facebook embedded player iframe URL with live attributes
        function getFacebookEmbedIframeHtml(url, height = "100%") {
            const encodedUrl = encodeURIComponent(url);
            // Added allowfullscreen, autoplay, and proper parameters for continuous playback without interruption
            return `<iframe src="https://www.facebook.com/plugins/video.php?href=${encodedUrl}&show_text=false&width=560&autoplay=true" width="100%" height="${height}" style="border:none;overflow:hidden" scrolling="no" frameborder="0" allowfullscreen="true" allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
        }

        function renderViewerPosts() {
            const feedContainer = document.getElementById('viewer-posts-feed');
            const mainPlayerContainer = document.getElementById('main-live-player-container');
            const posts = JSON.parse(localStorage.getItem('scmm_dashboard_posts') || '[]');

            let latestFacebookLiveUrl = null;

            if (posts.length === 0) {
                feedContainer.innerHTML = `
                    <div class="post-card">
                        <p style="color: #8da9c4; margin: 0;">No announcements at this time.</p>
                    </div>
                `;
                mainPlayerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
                return;
            }

            feedContainer.innerHTML = posts.map((post, index) => {
                let mediaHtml = '';
                if (post.mediaData) {
                    if (post.mediaType === 'video') {
                        mediaHtml = `<div class="post-media-container"><video controls src="${post.mediaData}"></video></div>`;
                    } else {
                        mediaHtml = `<div class="post-media-container"><img src="${post.mediaData}" alt="Post media"></div>`;
                    }
                }

                // Search for Facebook live/video link in title or content
                const fullText = (post.title || "") + " " + (post.content || "");
                const detectedFbUrl = extractFacebookUrl(fullText);

                // Track the very first (latest) Facebook link encountered to feature on the main player box
                if (detectedFbUrl && !latestFacebookLiveUrl) {
                    latestFacebookLiveUrl = detectedFbUrl;
                }

                let fbEmbedHtml = '';
                if (detectedFbUrl) {
                    fbEmbedHtml = `<div class="post-media-container" style="height: 315px; margin-top: 10px;">${getFacebookEmbedIframeHtml(detectedFbUrl, "315")}</div>`;
                }

                return `
                    <div class="post-card">
                        <h4>${escapeHtml(post.title)}</h4>
                        ${post.content ? `<p>${escapeHtml(post.content)}</p>` : ''}
                        ${mediaHtml}
                        ${fbEmbedHtml}
                        <div class="post-date">Published: ${post.date}</div>
                    </div>
                `;
            }).join('');

            // Automatically sync the main top video player box with the newest Facebook Live link if available
            if (latestFacebookLiveUrl) {
                // Only reload iframe source if it changed to prevent playback stutter/reloading bugs
                const currentIframe = mainPlayerContainer.querySelector('iframe');
                const targetEmbedHtml = getFacebookEmbedIframeHtml(latestFacebookLiveUrl, "100%");
                
                if (!currentIframe || !currentIframe.src.includes(encodeURIComponent(latestFacebookLiveUrl))) {
                    mainPlayerContainer.innerHTML = targetEmbedHtml;
                }
            } else {
                // Fallback to default YouTube live stream stream box if no FB live link is posted
                const currentIframe = mainPlayerContainer.querySelector('iframe');
                if (!currentIframe || !currentIframe.src.includes('youtube.com')) {
                    mainPlayerContainer.innerHTML = `<iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" allowfullscreen allow="autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"></iframe>`;
                }
            }
        }

        function escapeHtml(text) {
            if (!text) return '';
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        renderViewerPosts();
        // Polling interval ensures seamless real-time syncing across all active viewer tabs without manual page refreshes
        setInterval(renderViewerPosts, 2500);
    </script>
</body>
</html>
