<div class="comment-section">
    <h3>Comments</h3>
    
    <div id="comment-list">
        {% include 'broadcast/partials/comment_list.html' %}
    </div>

    <form hx-post="{% url 'live_viewer' %}" 
          hx-target="#comment-list" 
          hx-swap="innerHTML" 
          hx-on::after-request="if(event.detail.successful) this.reset()"
          style="margin-top: 15px;">
        {% csrf_token %}
        <input type="text" name="name" placeholder="Your Name" required 
               style="width: 100%; padding: 8px; margin-bottom: 5px; background: #fff; color: #000; border: none;">
        <textarea name="body" placeholder="Write a comment..." required 
                  style="width: 100%; padding: 8px; background: #fff; color: #000; border: none;"></textarea>
        <button type="submit" 
                style="margin-top: 10px; background: var(--accent-gold); border: none; padding: 10px 20px; cursor: pointer; font-weight: bold;">
            Post Comment
        </button>
    </form>
</div>
