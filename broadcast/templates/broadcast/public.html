<!DOCTYPE html>
<html>
<head>
    <title>Live Stream</title>
</head>
<body>
    <h1>Welcome to the Live Stream</h1>
    
    <iframe 
        width="800" 
        height="450" 
        src="https://www.youtube.com/embed/YOUR_VIDEO_ID" 
        frameborder="0" 
        allowfullscreen>
    </iframe>

    <section>
        <h2>Announcements</h2>
        {% if posts %}
            <ul>
                {% for post in posts %}
                    <li>{{ post.content }} <small>({{ post.created_at|date:"M d, Y H:i" }})</small></li>
                {% endfor %}
            </ul>
        {% else %}
            <p>No announcements at this time.</p>
        {% endif %}
    </section>

    <p>Enjoy the broadcast!</p>
</body>
</html>
