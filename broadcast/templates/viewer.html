<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMM Live Media Center</title>
    <style>
        :root { --bg-dark-blue: #0b2545; --accent-gold: #e2b13c; --text-light: #ffffff; }
        body { font-family: sans-serif; background-color: var(--bg-dark-blue); color: var(--text-light); margin: 0; padding: 20px; }
        
        /* Layout */
        .page-wrapper { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
        .stream-column { display: flex; flex-direction: column; gap: 20px; }
        
        /* Embed Styles */
        .stream-box { background: #000; border-radius: 8px; overflow: hidden; aspect-ratio: 16 / 9; width: 100%; }
        iframe { width: 100%; height: 100%; border: none; }
        
        /* Posts Style */
        .posts-section { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 8px; }
        .post-card { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 6px; margin-bottom: 15px; }
        .post-card h3 { color: var(--accent-gold); margin-top: 0; }
        
        @media (max-width: 900px) { .page-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <h1 style="text-align: center;">SCMM Live Broadcast</h1>

    <div class="page-wrapper">
        <div class="stream-column">
            <h3>YouTube Live</h3>
            <div class="stream-box">
    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" 
            allow="autoplay; encrypted-media" 
            allowfullscreen>
    </iframe>
</div>

<div class="stream-box">
    <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/YOUR_PAGE_URL&show_text=0" 
            allowfullscreen>
    </iframe>
</div>

<div class="stream-box">
    <iframe src="https://www.tiktok.com/embed/@YOUR_TIKTOK_USER" 
            allowfullscreen>
    </iframe>
</div>

        <div class="posts-section">
            <h2>Latest Updates</h2>
            {% for post in posts %}
                <div class="post-card">
                    <h3>{{ post.title }}</h3>
                    <p>{{ post.content }}</p>
                    <small style="color: #aaa;">{{ post.created_at|date:"F d, Y" }}</small>
                </div>
            {% empty %}
                <p>No new announcements.</p>
            {% endfor %}
        </div>
    </div>

</body>
</html>
