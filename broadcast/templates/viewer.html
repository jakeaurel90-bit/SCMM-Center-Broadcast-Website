<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCMM Live Media Center</title>
    <style>
        :root { 
            --bg-dark-blue: #0b2545; 
            --accent-gold: #e2b13c; 
            --text-light: #ffffff; 
        }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-dark-blue); 
            color: var(--text-light); 
            margin: 0; 
            padding: 20px; 
        }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .page-wrapper { display: grid; grid-template-columns: 2fr 1fr; gap: 30px; }
        
        .stream-column { display: flex; flex-direction: column; gap: 20px; }
        .stream-box { 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            aspect-ratio: 16 / 9; 
            width: 100%; 
            border: 2px solid var(--accent-gold); 
        }
        iframe { width: 100%; height: 100%; border: none; }
        
        .posts-section { background: rgba(255,255,255,0.05); padding: 25px; border-radius: 12px; }
        .post-card { 
            background: rgba(255,255,255,0.08); 
            padding: 20px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            border-left: 4px solid var(--accent-gold); 
        }
        .post-card h3 { color: var(--accent-gold); margin-top: 0; }
        .post-image { 
            width: 100%; 
            max-height: 300px; 
            object-fit: cover; 
            border-radius: 6px; 
            margin-bottom: 15px; 
            display: block; 
        }
        
        @media (max-width: 900px) { .page-wrapper { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1 style="color: var(--accent-gold);">SCMM Live Broadcast</h1>
        </header>

        <div class="page-wrapper">
            <main class="stream-column">
                <h3>YouTube Live</h3>
                <div class="stream-box">
                    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCNTPk7KOO3J8ThjzGmuRk0Q" allowfullscreen></iframe>
                </div>
                <h3>Facebook Live</h3>
                <div class="stream-box">
                    <iframe src="https://www.facebook.com/plugins/video.php?href=https://www.facebook.com/YOUR_PAGE_URL" allowfullscreen></iframe>
                </div>
            </main>
            
            <aside class="posts-section">
                <h2>Latest Updates</h2>
                {% for post in posts %}
                    <article class="post-card">
                        {% if post.image %}
                            <img src="{{ post.image.url }}" alt="{{ post.title }}" class="post-image">
                        {% endif %}
                        <h3>{{ post.title }}</h3>
                        <p>{{ post.content }}</p>
                        <small style="color: #aaa;">{{ post.created_at|date:"F d, Y" }}</small>
                    </article>
                {% empty %}
                    <p>No new announcements.</p>
                {% endfor %}
            </aside>
        </div>
    </div>
</body>
</html>
